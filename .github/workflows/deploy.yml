# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Lets this workflow publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5 # get the code
      - uses: actions/setup-node@v5 # install Node
        with:
          node-version: lts/*
      - run: npm ci # install packages
      - run: npm run build # build the site into dist/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4 # hand dist/ to GitHub Pages
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4 # publish it
